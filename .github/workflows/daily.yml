name: AI HOT Daily

on:
  schedule:
    # UTC 22:00 = 北京时间次日 06:00
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy-notify:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build daily report
        run: node build.js

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html ai_daily_*.html _site/
          ls -la _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit outputs back (data cache + built HTML + enriched)
        continue-on-error: true
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add daily_raw.json items_raw.json index.html ai_daily_latest.html ai_daily_mobile_latest.html ai_daily_summary.json ai_daily_enriched.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: daily output $(date -u +%F)"
          git push

      - name: Purge jsDelivr CDN cache
        continue-on-error: true
        run: |
          for f in index.html ai_daily_latest.html ai_daily_mobile_latest.html; do
            curl -s "https://purge.jsdelivr.net/gh/adriangeng/ai-daily@main/$f" > /dev/null || true
          done
          echo "jsDelivr cache purged"

      - name: AI enrich (LLM 一句话点评)
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: node enrich.js

      - name: Push WeChat notification
        continue-on-error: true
        env:
          PUSH_CONFIG_JSON: ${{ secrets.PUSH_CONFIG_JSON }}
        run: |
          if [ -z "$PUSH_CONFIG_JSON" ]; then
            echo "PUSH_CONFIG_JSON secret 未配置，跳过微信推送"
            exit 0
          fi
          printf '%s' "$PUSH_CONFIG_JSON" > .push_config.json
          # 微信推送用 GitHub Pages 固定链接（Content-Type 正确，可正常渲染网页）
          node notify.js "https://adriangeng.github.io/ai-daily/"
