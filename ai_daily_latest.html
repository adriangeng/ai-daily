误操作。","sourceName":"Linear：Now（RSS）","sourceUrl":"https://linear.app/now/how-we-built-linear-agent","publishedAt":null,"comment":"","n":18,"isWeChat":false},{"title":"Forking-Sequences：一种统计与计算上更高效的多步预测训练范式","summary":"CMU的研究团队提出了一种新的多步预测训练方法——forking-sequences，这种方法在统计和计算效率上都表现出色。与传统方法不同，forking-sequences可以在一次前向传播中完成所有预测，通过创建日期编码解码整条序列，无需额外参数。这种方法不仅简化了训练过程，还提高了模型的预测准确性，为多步预测任务提供了新的解决方案。","sourceName":"CMU：Machine Learning Blog","sourceUrl":"https://blog.ml.cmu.edu/2026/08/10/forking-sequences-part-i-statistically-and-computationally-efficient-multi-horizon-forecasting","publishedAt":null,"comment":"","n":19,"isWeChat":false},{"title":"开源不等于开放权重：Gary Marcus 剖析两者本质差异","summary":"Gary Marcus在他的分析中指出，开放权重模型与真正的开源软件在透明度和可定制性方面存在显著差异。虽然开放权重模型提供了训练后的神经网络权重，但这并不意味着用户可以完全访问和修改模型的内部结构。相比之下，开源软件允许任何人查看、修改甚至分支源代码，从而提供更高的灵活性和透明度。这种差异使得在实际应用中，开放权重模型可能无法满足所有用户的需求，特别是在科研和监管领域。","sourceName":"Gary Marcus：The Road to AI We Can Trust（RSS）","sourceUrl":"https://garymarcus.substack.com/p/open-source-is-not-the-same-as-open","publishedAt":null,"comment":"","n":20,"isWeChat":false}],"empty":false,"review":"tl;dv公开逾18.1万段AI会议录音，引发隐私担忧。a16z的数据表明智能体确实能高效使用电脑。扎克伯格主张超级智能应人人可用，Linear Agent与Forking-Sequences则提供了新的技术视角。"}],"flashes":[],"total":20,"moduleStats":[{"label":"模型 & 产品","count":11},{"label":"行业 & 论文","count":3},{"label":"技巧与观点","count":6},{"label":"AI 概念股","count":8}],"source":"aihot.virxact.com","stocks":[{"t":"NVDA","name":"英伟达","mkt":"us","mktLabel":"美股","price":217.55,"prev":223.96,"change":-6.409999999999997,"changePct":-2.8621182353991768,"currency":"USD","sym":"$","bjTime":"8月11日 周二 04:00","dayHigh":224.14,"dayLow":216.77},{"t":"MSFT","name":"微软","mkt":"us","mktLabel":"美股","price":506.06,"prev":499.99,"change":6.069999999999993,"changePct":1.2140242804856083,"currency":"USD","sym":"$","bjTime":"8月11日 周二 04:00","dayHigh":513.73,"dayLow":502.27},{"t":"GOOGL","name":"谷歌","mkt":"us","mktLabel":"美股","price":357.52,"prev":354.3,"change":3.2199999999999704,"changePct":0.9088343211967175, const WK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const pad = n => String(n).padStart(2,'0');

function fmtDateHuman(ds){
  const [y,m,d] = ds.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  return y + '年' + m + '月' + d + '日 ' + WK[dt.getUTCDay()];
}
function fmtBJ(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const bj = new Date(d.getTime() + 8*3600*1000);
  const M = bj.getUTCMonth()+1, D = bj.getUTCDate();
  const now = new Date(Date.now()+8*3600*1000);
  const tM = now.getUTCMonth()+1, tD = now.getUTCDate();
  let prefix;
  if(M===tM && D===tD) prefix='今天';
  else if(M===tM && D===tD-1) prefix='昨天';
  else prefix = M + '月' + D + '日';
  return prefix + ' ' + pad(bj.getUTCHours()) + ':' + pad(bj.getUTCMinutes());
}

    const up = q.change >= 0;
    const card = document.createElement('div');
    card.className = 'stock-card ' + (up ? 'up' : 'down');
    const arrow = up ? '▲' : '▼';
    const sign = up ? '+' : '';
    const rng = (q.dayLow != null && q.dayHigh != null)
      ? ('今日 ' + q.sym + q.dayLow.toFixed(2) + '–' + q.dayHigh.toFixed(2))
      : '';
    card.innerHTML =
      '<div class="sc-top"><span class="sc-tk">' + q.t + '</span>' +
        '<span class="sc-name">' + q.name + '</span>' +
        '<span class="sc-mkt">' + q.mktLabel + '</span></div>' +
      '<div class="sc-price"><span class="sc-cur">' + q.sym + '</span>' + q.price.toFixed(2) +
        ' <span class="sc-chg">' + arrow + ' ' + sign + q.change.toFixed(2) +
        ' (' + sign + q.changePct.toFixed(2) + '%)</span></div>' +
      (rng ? '<div class="sc-range">' + rng + '</div>' : '') +
      '<div class="sc-time">更新 ' + (q.bjTime || '') + '（北京时间）</div>';
    grid.appendChild(card);
  });
  main.appendChild(sec);
}

// FLASHES (bonus)
if(DATA.flashes && DATA.flashes.length){
  const sec = document.createElement('section');
  sec.className = 'section sec-flash';
  sec.id = 'sec-flashes';
  sec.innerHTML =
    '<div class="sec-head">' +
      '<span class="sec-dot"></span>' +
      '<h2>快讯</h2>' +
      '<span class="cnt">' + DATA.flashes.length + ' 条</span>' +
    '</div><div class="grid flash-grid"></div>';
  const grid = sec.querySelector('.grid');
  DATA.flashes.forEach(function(it){
    const card = document.createElement('article');
    card.className = 'card';
    const time = fmtBJ(it.publishedAt);
    card.innerHTML =
      '<div class="c-top">' +
        '<span class="badge">' + it.n + '</span>' +
        '<span class="chip" title="' + it.sourceName.replace(/"/g,'&quot;') + '">' + it.sourceName + '</span>' +
        (it.isWeChat ? '<span class="chip wx" style="background:#07c160;color:#fff">💬 公众号</span>' : '') +
        (time ? '<span class="ctime">' + time + '</span>' : '') +
      '</div>' +
      '<h3>' + it.title + '</h3>' +
      '<p class="sum">' + it.summary + '</p>' +
      (it.comment ? '<div class="comment"><span class="cl">辣评</span>' + it.comment + '</div>' : '') +
      '<a class="go" href="' + it.sourceUrl + '" target="_blank" rel="noopener noreferrer">查看原文</a>';
    grid.appendChild(card);
  });
  main.appendChild(sec);
}

// FOOTER
document.getElementById('footTotal').textContent = '本日报共 ' + DATA.total + ' 条 AI 动态';

// back to top
const topBtn = document.getElementById('top');
window.addEventListener('scroll', function(){
  topBtn.classList.toggle('show', window.scrollY > 500);
});
topBtn.addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); });

</script>
</body>
</html>
