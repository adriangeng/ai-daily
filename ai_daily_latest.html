well GPU 上如何将批处理 1 解码延迟降低 54%","summary":"蚂蚁 Ling Infra 团队与 RadixArk SGLang 团队通过优化 Ling-3.0-flash 混合线性注意力机制的模型，在使用 4 块 Blackwell GPU 时，将单请求解码速度从 288 tok/s 提升至 606 tok/s，平均 TPOT 从 3.33 ms 降至 1.53 ms，显著提升了模型的实时处理能力。这一改进不仅在性能上取得了突破，还为大规模语言模型部署提供了新的可能性。","sourceName":"LMSYS：Blog（Chatbot Arena 团队）","sourceUrl":"https://www.lmsys.org/blog/2026-08-21-ling3-flash-spec-decode-blackwell","publishedAt":"2026-08-21T17:56:25.415Z","comment":"","n":9,"isWeChat":false},{"title":"微型语言模型中干扰权重的特征刻画","summary":"Anthropic 团队首次在单层 transformer 模型中直接展示了干扰权重的存在及其对训练损失的影响。通过将模型分解为 token、位置、特征和 logits 之间的虚拟权重，研究人员能够分析这些干扰权重如何影响模型的训练过程，并为未来减少干扰、提高模型训练效率提供了新的研究方向。","sourceName":"Anthropic：Transformer Circuits（可解释性研究）","sourceUrl":"https://transformer-circuits.pub/2026/interference_effectiveness_helpfulness/index.html","publishedAt":null,"comment":"","n":10,"isWeChat":false},{"title":"Google 推出 Biomarker Discovery Framework：从可穿戴传感器数据中筛选候选生物标志物的多智能体系统","summary":"Google 推出的 Biomarker Discovery Framework 是一个多智能体系统，能够从可穿戴传感器数据中筛选出候选生物标志物。该系统通过迭代假设生成、统计分析与文献推理，成功恢复了已知的临床信号，并在三个队列中识别出跨独立数据集的一致生物标志物。此外，该系统在结合人口统计特征后，显著提升了下游预测性能。","sourceName":"Google Research：Blog（网页）","sourceUrl":"https://research.google/blog/an-ai-tool-for-prioritizing-candidate-biomarkers-from-wearable-sensor-data","publishedAt":null,"comment":"","n":11,"isWeChat":false},{"title":"移动性如何让语言模型更深入地理解地点","summary":"Google Research 推出的 Mobility-Embedded POIs（ME-POIs）框架，通过结合聚合匿名移动模式与文本描述，为地点构建了融合身份与动态功能的嵌入向量。该框架在未见地点上，使访问意图预测相对提升 81.9%，价格等级分类提升 75.1%，繁忙度估算准确率提升 24.7%，显著提升了语言模型对地点的理解能力。","sourceName":"Google Research：Blog（网页）","sourceUrl":"https://research.google/blog/how-mobility-gives-language-models-a-deeper-understanding-of-place","publishedAt":null,"comment":"","n":12,"isWeChat":false}],"empty":false,"review":"论文方面，每个模型都会作弊的研究揭示了 AI 伦理问题的紧迫性，而 Google 的 Biomarker Discovery Framework 则展示了 AI 在医疗领域的潜力。"},{"key":"tips","label":"技巧与观点","items":[{"title":"AI 原生 SDLC 实战手册：Anthropic 如何用 Claude 重塑软件开发生命周期","summary":"Anthropic 发布的 AI 原生 SDLC const WK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const pad = n => String(n).padStart(2,'0');

function fmtDateHuman(ds){
  const [y,m,d] = ds.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  return y + '年' + m + '月' + d + '日 ' + WK[dt.getUTCDay()];
}
function fmtBJ(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const bj = new Date(d.getTime() + 8*3600*1000);
  const M = bj.getUTCMonth()+1, D = bj.getUTCDate();
  const now = new Date(Date.now()+8*3600*1000);
  const tM = now.getUTCMonth()+1, tD = now.getUTCDate();
  let prefix;
  if(M===tM && D===tD) prefix='今天';
  else if(M===tM && D===tD-1) prefix='昨天';
  else prefix = M + '月' + D + '日';
  return prefix + ' ' + pad(bj.getUTCHours()) + ':' + pad(bj.getUTCMinutes());
}
