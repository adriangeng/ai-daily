渲染时间。XY 的发布为数据可视化提供了高性能的解决方案，有助于提升大数据分析和交互式应用的效率。","sourceName":"MarkTechPost（RSS）","sourceUrl":"https://www.marktechpost.com/2026/08/04/reflex-open-sources-xy-a-rust-backed-super-fast-python-charting-library-that-keeps-100-million-point-charts-interactive","publishedAt":"2026-08-04T08:57:47.000Z","comment":"","n":9,"isWeChat":false},{"title":"Soup v0.72.4：在4 GB显存笔记本GPU上微调8B模型","summary":"Soup最新版v0.72.4支持在配备4GB显存的笔记本GPU上通过QLoRA微调8B模型，无需SSH或云服务。Soup通过优化内存使用和计算资源分配，使得开发者可以在资源有限的设备上进行高效的模型微调，降低了深度学习模型开发的硬件门槛，让更多人能够参与到模型训练和优化中来。","sourceName":"Hacker News 热门（buzzing.cc 中文翻译）","sourceUrl":"https://github.com/MakazhanAlpamys/Soup","publishedAt":"2026-08-04T18:17:29.648Z","comment":"","n":10,"isWeChat":false},{"title":"OpenRouter 推出 ori CLI：为 Claude Code 等 Harness 提供开箱即用的优化配置","summary":"OpenRouter发布了oriCLI，用户安装并登录后即可获得针对ClaudeCode、Codex、OpenCode、Hermes等harness的优化配置，省去了手动设置大量环境变量的麻烦。oriCLI的推出极大地简化了开发者的工作流程，使得AI应用的部署变得更加便捷，有助于加速AI技术在各个领域的应用和普及。","sourceName":"OpenRouter：Announcements（RSS）","sourceUrl":"https://openrouter.ai/blog/announcements/ori-harness","publishedAt":"2026-08-04T00:00:00.000Z","comment":"","n":11,"isWeChat":false},{"title":"SpecForge v0.3.0 发布：统一解耦与共置投机解码栈，新增开放 SpecBundle 草稿模型","summary":"SpecForgev0.3.0将目标模型推理与草稿模型训练分离，支持EAGLE3、EAGLE3.1、P-EAGLE、DFlash、Domino、DSpark等多种投机解码算法，并统一了在线、离线与解耦工作流。这一更新为开发者提供了更加灵活和高效的模型训练和推理环境，有助于提高模型的性能和响应速度。","sourceName":"LMSYS：Blog（Chatbot Arena 团队）","sourceUrl":"https://www.lmsys.org/blog/2026-08-04-specforge-v0-3","publishedAt":"2026-08-04T17:51:09.590Z","comment":"","n":12,"isWeChat":false},{"title":"Replit 环境智能：免提示词自动生成设计","summary":"Replit环境智能（AmbientIntelligence）会在每个画面旁显示建议卡片，每张卡片都指向设计的一个不同方向。用户只需点击喜欢的卡片，即可看到生成的新画面，无需提示词或设计语言。环境智能功能为设计师提供了更加直观和便捷的设计体验，有助于提高设计效率和创意表达。","sourceName":"X：Replit (@Replit)","sourceUrl":"https://x.com/Replit/status/2084761337570144424","publishedAt":"2026-08-04T22:00:10.000Z","comment":"","n":13,"isWeChat":false},{"title":"Cloudflare 让智能体通过本地追踪调试 Workers","summary":"Cloudflare在wranglerdev和vitedev中自动为本地Worker调用捕获OpenTelemetry追踪，无需安装SDK或配置智能体。智能体可通过LocalExplorerAPI查询追踪数据，定位失败操作、修复本地环境并验证结果。开发者也可在浏览器界面LocalExplorer中可视化查看spans、时序、错误及关联控制台日志。这项功能简化了开发者追踪和调试本地Worker的过程，提高了开发效率。","sourceName":"Cloudflare Blog","sourceUrl":"https://blog.cloudflare.com/local-tracing","publishedAt":"2026-08-04T13:00:00.000Z","comment":"","n":14,"isWeChat":false}],"empty":false,"review":"今日AI模型与产品资讯繁多，亮点频出。NVIDIA与商汤的新模型为Robotaxi与图像生成提供了前沿技术支持，OpenRouter与蚂蚁百灵则分别在多模态模型与开源权重上有所突破。这些进展表明AI技术正快速迭代，推动自动驾驶与多模态应用的商业化进程。"},{"key":"industry-paper","label":"行业 & 论文","items":[{"title":"Anthropic 与成立仅数月的云初创公司 Volta 签署 100 亿美元算力协议","summary":"Anthropic与成立仅数月的云初创公司Volta签署了100亿美元的算力协议，约合每年17亿美元。Volta估值24亿美元，硬件几乎全为租用，算力来自比特币矿商Bitdeer挪威121MW站点，芯片由Nvidia供应、Dell组装。Anthropic买的是交付速度，代价是承担超大规模云厂商合同从未有过的交易对手风险。","sourceName":"X：Rohan Paul (@rohanpaul_ai)","sourceUrl":"https://x.com/rohanpaul_ai/status/2084655258102546579","publishedAt":"2026-08-04T14:58:39.000Z","comment":"","n":15,"isWeChat":false},{"title":"工信部发布首部L3/L4自动驾驶系统安全要求强制性国标，2027年7月实施","summary":"工信部组织制定的《智能网联汽车自动驾驶系统安全要求》（GB44721—2026）强制性国家标准获批发布，拟于2027年7月1日起实施。这是我国首部针对L3级有条件自动驾驶和L4级高度自动驾驶系统的强制性国标，由2024年推荐性国标GB/T44721—2024升级而来，为自动驾驶产品明确了统一的安全准入基线。","sourceName":"IT之家（RSS）","sourceUrl":"https://www.ithome.com/0/985/665.htm","publishedAt":"2026-08-04T11:06:29.000Z","comment":"","n":16,"isWeChat":false},{"title":"GPT-5.6 Luna降价80%永久生效","summary":"GPT-5.6 Luna大幅降价80%，这并非一次性促销，而是永久性政策。此举旨在提升产品的市场竞争力，同时保持其高效性能。此举将使更多用户能够负担得起这款先进的AI产品，进一步推动其普及与应用。","sourceName":"X：Tibo (@thsottiaux)","sourceUrl":"https://x.com/thsottiaux/status/2084506501834829833","publishedAt":"2026-08-04T05:07:32.000Z","comment":"","n":17,"isWeChat":false},{"title":"Mariano-Florentino (Tino) Cuéllar 加入 Anthropic 出任首席全球事务官","summary":"Mariano-Florentino (Tino) Cuéllar正式加入Anthropic，担任首席全球事务官，负责全球政策、国际战略参与及政府关系事务。Cuéllar曾担任卡内基国际和平基金会主席和加州最高法院法官，具有丰富的领导和政策制定经验。此次任命表明Anthropic正积极加强其全球战略和政府关系，以更好地应对AI技术带来的挑战和机遇。","sourceName":"Anthropic：Newsroom（网页）","sourceUrl":"https://www.anthropic.com/news/tino-cuellar","publishedAt":null,"comment":"","n":18,"isWeChat":false},{"title":"OpenAI 说明第三方网络安全评估事件并公布新保障措施","summary":"OpenAI针对近期的第三方网络安全评估事件作出了详细说明，并宣布了一系列新保障措施，以强化AI模型的测试与评估流程。这些措施旨在提升模型评估的安全性和可靠性，确保所有第三方测试都在严格监控和控制的环境下进行。此举有助于增强用户对OpenAI产品的信心，并推动整个行业的安全标准的提升。","sourceName":"OpenAI：官网动态（RSS · 排除企业/客户案例）","sourceUrl":"https://openai.com/index/third-party-cyber-evaluations-involving-openai-models","publishedAt":null,"comment":"","n":19,"isWeChat":false},{"title":"AI 领袖提出 SAFE 指南，强化智能体网络安全透明度","summary":"Linux基金会发布了共享AI事件交换（SAFE）指南的征求意见稿，旨在将智能体网络安全事件转化为全生态共享防护。这一指南的发布标志着AI行业向更加透明和协作的方向迈进，有助于提升整个生态系统的安全水平，减少潜在的网络安全威胁。","sourceName":"NVIDIA Blog（RSS）","sourceUrl":"https://blogs.nvidia.com/blog/open-secure-ai-alliance-contributions","publishedAt":null,"comment":"","n":20,"isWeChat":false},{"title":"Google 发布 Gemini 3.6 Flash 等三款新模型及 Gemini Robotics ER 2","summary":"Google宣布推出三款新Gemini模型，包括Gemini 3.6 Flash、3.5 Flash-Lite和3.5 Flash Cyber，这些模型专为生产级AI智能体设计，具有更高的token效率、更低的延迟和更可靠的性能。这些新模型的发布将进一步巩固Google在AI领域的领先地位，为开发者和企业提供更强大的工具来构建和部署AI应用。","sourceName":"Google Blog：AI（RSS）","sourceUrl":"https://blog.google/innovation-and-ai/technology/ai/google-ai-updates-july-2026","publishedAt":null,"comment":"","n":21,"isWeChat":false}],"empty":false,"review":"行业动态方面，Anthropic与Volta的巨额算力协议引人注目，工信部新标准将规范自动驾驶安全，GPT-5.6 Luna大幅降价，凸显了AI产业的激烈竞争与技术进步。"},{"key":"tips","label":"技巧与观点","items":[{"title":"从零开始，教你用Codex搓出属于你自己的第一个硬件","summary":"一位零基础作者通过与Codex对话，在5天内完成了一个提醒久坐的猫爪硬件项目。该项目涵盖了需求讨论、电路搭建、代码烧录和3D打印组装等环节。此外，文章还提及了用Agent调试宏键盘以及OpenAI与Work Louder联名发布的Codex Micro键盘（13个机械按键，售价230美元）等案例，强调了“干中学”的AI开发方式。","sourceName":"公众号：数字生命卡兹克","sourceUrl":"https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647684924&idx=1&sn=f9ecf13ac374f13dfa75f98f685a231d","publishedAt":"2026-08-04T00:06:00.000Z","comment":"","n":22,"isWeChat":true},{"title":"在单颗 AMD MI300X 上运行 DeepSeek V4 Flash","summary":"一个开源仓库提供了在单颗AMD MI300X上运行DeepSeek V4 Flash的完整配置与补丁，展示了一个无需额外量化或权重卸载的模型。该模型在192GB HBM上实现了单流168.6to const WK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const pad = n => String(n).padStart(2,'0');

function fmtDateHuman(ds){
  const [y,m,d] = ds.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  return y + '年' + m + '月' + d + '日 ' + WK[dt.getUTCDay()];
}
function fmtBJ(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const bj = new Date(d.getTime() + 8*3600*1000);
  const M = bj.getUTCMonth()+1, D = bj.getUTCDate();
  const now = new Date(Date.now()+8*3600*1000);
  const tM = now.getUTCMonth()+1, tD = now.getUTCDate();
  let prefix;
  if(M===tM && D===tD) prefix='今天';
  else if(M===tM && D===tD-1) prefix='昨天';
  else prefix = M + '月' + D + '日';
  return prefix + ' ' + pad(bj.getUTCHours()) + ':' + pad(bj.getUTCMinutes());
}
