"https://blog.cloudflare.com/local-tracing","publishedAt":"2026-08-04T13:00:00.000Z","comment":"","n":14,"isWeChat":false}],"empty":false,"review":"今日模型&产品模块亮点频出，NVIDIA Alpamayo 2 Super、商汤 SenseNova U1 等新品纷纷亮相，推动自动驾驶和图像生成技术升级。Swiftlet 和 Reflex XY 则展示了AI在移动设备上的强大表现。"},{"key":"industry-paper","label":"行业 & 论文","items":[{"title":"Anthropic 与成立仅数月的云初创公司 Volta 签署 100 亿美元算力协议","summary":"Anthropic与成立仅数月的云初创公司Volta签署了100亿美元的算力协议，约合每年17亿美元。Volta的硬件几乎全为租用，算力来自比特币矿商Bitdeer挪威121MW站点，芯片由Nvidia供应、Dell组装。虽然这一协议为Anthropic提供了快速交付算力的能力，但也带来了超大规模云厂商合同从未有过的交易对手风险。","sourceName":"X：Rohan Paul (@rohanpaul_ai)","sourceUrl":"https://x.com/rohanpaul_ai/status/2084655258102546579","publishedAt":"2026-08-04T14:58:39.000Z","comment":"","n":15,"isWeChat":false},{"title":"工信部发布首部L3/L4自动驾驶系统安全要求强制性国标，2027年7月实施","summary":"工信部发布了首部针对L3级有条件自动驾驶和L4级高度自动驾驶系统的强制性国家标准《智能网联汽车 自动驾驶系统安全要求》（GB 44721—2026），该标准由2024年推荐性国标GB/T 44721—2024升级而来，将于2027年7月1日起实施。这一标准的发布为自动驾驶产品的安全准入设定了统一的基线，标志着中国在智能网联汽车领域的标准化建设迈出了重要一步。","sourceName":"IT之家（RSS）","sourceUrl":"https://www.ithome.com/0/985/665.htm","publishedAt":"2026-08-04T11:06:29.000Z","comment":"","n":16,"isWeChat":false},{"title":"GPT-5.6 Luna降价80%永久生效","summary":"GPT-5.6 Luna大幅降价80%的消息引起了广泛关注，但OpenAI澄清，这不是一次性的促销活动，而是永久性的价格调整。这一决定旨在使更多用户能够负担得起这款高性能的AI模型。尽管价格下调，GPT-5.6 Luna的效率和性能并没有受到影响，这使得它在众多AI产品中脱颖而出，成为市场上的一大亮点。","sourceName":"X：Tibo (@thsottiaux)","sourceUrl":"https://x.com/thsottiaux/status/2084506501834829833","publishedAt":"2026-08-04T05:07:32.000Z","comment":"","n":17,"isWeChat":false},{"title":"Mariano-Florentino (Tino) Cuéllar 加入 Anthropic 出任首席全球事务官","summary":"Mariano-Florentino (Tino) Cuéllar，这位曾担任卡内基国际和平基金会主席和加州最高法院法官的资深人士，正式加入了Anthropic，出任首席全球事务官。Cuéllar在加入Anthropic之前，自2026年1月起担任该公司的长期利益信托受托人。他的新角色将专注于全球政策、国际战略参与以及政府关系，旨在推动Anthropic在全球范围内的影响力。","sourceName":"Anthropic：Newsroom（网页）","sourceUrl":"https://www.anthropic.com/news/tino-cuellar","publishedAt":null,"comment":"","n":18,"isWeChat":false},{"title":"OpenAI 说明第三方网络安全评估事件并公布新保障措施","summary":"OpenAI就近期发生的第三方网络安全评估事件进行了详细说明，并同步公布了新的保障措施。这些措施旨在强化AI模型的测试与评估流程，确保所有第三方测试都能在严格控制的环境下进行，从而保证了模型评估的安全性和可靠性。此举不仅提升了OpenAI的透明度，也增强了用户对AI模型的信任。","sourceName":"OpenAI：官网动态（RSS · 排除企业/客户案例）","sourceUrl":"https://openai.com/index/third-party-cyber-evaluations-involving-openai-models","publishedAt":null,"comment":"","n":19,"isWeChat":false},{"title":"AI 领袖提出 SAFE 指南，强化智能体网络安全透明度","summary":"Linux基金会近期发布了共享AI事件交换（SAFE）指南的征求意见稿，该指南旨在通过将智能体网络安全事件转化为全生态共享防护，提高整个AI生态系统中的透明度和安全性。此举将有助于行业内的协作，共同防范潜在的安全威胁。","sourceName":"NVIDIA Blog（RSS）","sourceUrl":"https://blogs.nvidia.com/blog/open-secure-ai-alliance-contributions","publishedAt":null,"comment":"","n":20,"isWeChat":false},{"title":"Google 发布 Gemini 3.6 Flash 等三款新模型及 Gemini Robotics ER 2","summary":"Google于7月推出了三款新的Gemini模型，包括Gemini 3.6 Flash、3.5 Flash-Lite和3.5 Flash Cyber，这些模型专为生产级AI智能体设计，强调更高的token效率、更低的延迟和更可靠的性能。此次发布进一步巩固了Google在AI领域的领先地位，并为开发者提供了更多选择。","sourceName":"Google Blog：AI（RSS）","sourceUrl":"https://blog.google/innovation-and-ai/technology/ai/google-ai-updates-july-2026","publishedAt":null,"comment":"","n":21,"isWeChat":false}],"empty":false,"review":"行业&论文模块聚焦AI安全与法规，Anthropic 与 Volta 的算力协议、工信部自动驾驶系统安全要求，以及 SAFE 指南等，均指向AI行业的规范化与安全性提升。"},{"key":"tips","label":"技巧与观点","items":[{"title":"从零开始，教你用Codex搓出属于你自己的第一个硬件","summary":"一位零基础的作者通过与 Codex 对话，仅用五天时间就制作出一个提醒久坐的猫爪硬件，展示了 AI 在硬件开发中的巨大潜力。文章还介绍了用 Agent 调试宏键盘和 OpenAI 与 Work Louder 联名推出的 Codex Micro 键盘，强调了“干中学”的 AI 开发方式，为硬件爱好者提供了新的学习途径。","sourceName":"公众号：数字生命卡兹克","sourceUrl":"https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647684924&idx=1&sn=f9ecf13ac374f13dfa75f98f685a231d","publishedAt":"2026-08-04T00:06:00.000Z","comment":"","n":22,"isWeChat":true},{"title":"在单颗 AMD MI300X 上运行 DeepSeek V4 Flash","summary":"一个开源仓库提供了在单颗AMD MI300X上运行DeepSeek-V4-Flash-0731的完整配置与补丁，无需额外量化或权重卸载。该304B参数模型在192GB HBM上实现了单流168.6tok/s的解码速度和8并发流542tok/s的聚合吞吐，证明了其在256K上下文中的可行性。这一进展标志着AI模型在硬件上的优化取得了新的突破。","sourceName":"Hacker News 热门（buzzing.cc 中文翻译）","sourceUrl":"https://github.com/ryanzhou/deepseek-v4-flash-mi300x","publishedAt":"2026-08-04T12:56:45.712Z","comment":"","n":23,"isWeChat":false},{"title":"MiniMax-H3 通过 MLX 移植可在 Apple Silicon 上运行","summary":"MiniMax发布了MiniMax-H3，这是一个能够接受文本、图像、音频和视频并生成最长15秒带音频视频片段的通用全模态生成系统。通过Python包PipeNetwork/minimax-h3-mlx，该系统被移植到了MLX，使其能够在Apple Silicon上运行。作者在M5 Max MacBook Pro上进行了测试，下载约115GB模型文件后，视频生成耗时不到45分钟。这一技术进步为用户提供了更多的创作可能性。","sourceName":"Simon Willison 博客","sourceUrl":"https://simonwillison.net/2026/Aug/4/minimax-h3-mlx","publishedAt":"2026-08-04T19:10:09.000Z","comment":"","n":24,"isWeChat":false},{"title":"用 NVIDIA SkillSpector、LangGraph、YARA 规则、SARIF 与 CI 策略门构建高级 AI 技能安全审计流水线","summary":"本教程详细介绍了如何使用NVIDIA SkillSpector评估AI技能的安全态势，构建包含干净、风险、恶意及MCP示例的合成技能市场，并通过LangGraph检查流水线扫描每个技能。该方法为AI技能安全审计提供了高级的解决方案，有助于确保AI系统的安全性。","sourceName":"MarkTechPost（RSS）","sourceUrl":"https://www.marktechpost.com/2026/08/04/building-an-advanced-ai-skill-security-auditing-pipeline-with-nvidia-skillspector-langgraph-yara-rules-sarif-and-ci-policy-gates","publishedAt":"2026-08-04T08:12:36.000Z","comment":"","n":25,"isWeChat":false},{"title":"Cloudflare 如何用软件工厂将 Astro 的 GitHub issue 数降至零","summary":"Cloudflare 采用自动化 triage 流水线，通过隔离的 AI 子代理复现、诊断并修复 Astro 仓库中的 bug，显著降低了 GitHub issue 的数量。该流水线由 issue 标签驱动，实现精准定位与快速响应。修复后的代码会自动发布预览版本，供用户验证。底层的 Flue 引擎已发展为一个开源的平台无关框架，用于构建持久化智能体与工作流，展示了 AI 在软件开发中的强大应用潜力。","sourceName":"Cloudflare Blog","sourceUrl":"https://blog.cloudflare.com/astro-issue-triage","publishedAt":"2026-08-04T13:00:00.000Z","comment":"","n":26,"isWeChat":false},{"title":"GitHub 如何用堆叠式 Pull Request 拆解 AI 生成的巨型代码","summary":"GitHub 推出堆叠式 Pull Request（stacked PR）来解决 AI 编码智能体生成的巨型代码难以审查的问题。这种方法将大 diff 按照数据、API、接线和 UI 四个层面拆分，每层可分配给不同的审查者，提高了代码审查的效率和准确性。这样做不仅能够简化审查流程，还能确保代码质量，是 AI 时代代码管理的重要创新。","sourceName":"GitHub Blog","sourceUrl":"https://github.blog/engineering/turn-one-giant-ai-generated-pull-request-to-a-reviewable-stack","publishedAt":"2026-08-04T16:47:18.000Z","comment":"","n":27,"isWeChat":false},{"title":"如何用 LangSmith 评估语音智能体" const WK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const pad = n => String(n).padStart(2,'0');

function fmtDateHuman(ds){
  const [y,m,d] = ds.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  return y + '年' + m + '月' + d + '日 ' + WK[dt.getUTCDay()];
}
function fmtBJ(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const bj = new Date(d.getTime() + 8*3600*1000);
  const M = bj.getUTCMonth()+1, D = bj.getUTCDate();
  const now = new Date(Date.now()+8*3600*1000);
  const tM = now.getUTCMonth()+1, tD = now.getUTCDate();
  let prefix;
  if(M===tM && D===tD) prefix='今天';
  else if(M===tM && D===tD-1) prefix='昨天';
  else prefix = M + '月' + D + '日';
  return prefix + ' ' + pad(bj.getUTCHours()) + ':' + pad(bj.getUTCMinutes());
}
