n 3.5 Lightning 支持MTP、DFlash、DSpark三种解码技术，并通过OpenAI兼容API提供接入，简化了智能体工作流的集成过程。","sourceName":"LMSYS：Blog（Chatbot Arena 团队）","sourceUrl":"https://www.lmsys.org/blog/2026-08-11-nemotron-3-5-lightning","publishedAt":"2026-08-11T13:51:45.827Z","comment":"","n":4,"isWeChat":false},{"title":"Runway Seedance 2.5 上线，支持50角色参考","summary":"Runway 上线了 Seedance 2.5 版本，支持最多50个独特角色参考，并能生成最长30秒的与音乐同步的片段。用户可以通过点击链接开始使用，体验更加丰富的创意生成过程。Seedance 2.5 的推出为音乐和视频制作提供了更多可能性，有助于激发创意灵感。","sourceName":"X：Runway (@runwayml)","sourceUrl":"https://x.com/runwayml/status/2087251184658657346","publishedAt":"2026-08-11T18:53:56.000Z","comment":"","n":5,"isWeChat":false},{"title":"Gemini 助力 Database Migration Service 加速 PostgreSQL 迁移","summary":"Google Cloud 在 Database Migration Service 中引入了由 Gemini 驱动的 AI 辅助代码转换功能，旨在加速 PostgreSQL 数据库的迁移过程。这项新功能可以将 Oracle 或 SQL Server 的存储过程、触发器和自定义函数转换为 PostgreSQL PL/pgSQL 代码，简化了数据库迁移工作，提高了迁移效率。","sourceName":"Google Cloud：Databases（RSS）","sourceUrl":"https://cloud.google.com/blog/products/databases/accelerate-postgresql-migrations-with-gemini-in-dms","publishedAt":"2026-08-11T16:00:00.000Z","comment":"","n":6,"isWeChat":false},{"title":"ChatGPT 桌面端支持导入其他智能体工作数据","summary":"ChatGPT 桌面端现在支持导入其他智能体的工作数据，包括项目、聊天记录、技能和插件，用户可以通过设置开启自动更新。这一功能使ChatGPT与其它智能体的协作更加紧密，提高了工作效率。","sourceName":"X：OpenAI Developers (@OpenAIDevs)","sourceUrl":"https://x.com/OpenAIDevs/status/2087242829076791392","publishedAt":"2026-08-11T18:20:44.000Z","comment":"","n":7,"isWeChat":false},{"title":"Databricks 开源 Metals v2：面向数百万行代码库的 Java 和 Scala 语言服务器","summary":"Databricks 开源了 Metals v2，这是专为智能体驱动的开发场景设计的Java和Scala语言服务器。Metals v2 提升了大规模代码库中的编辑与导航性能，为工程师提供了更好的开发体验。Databricks 的大部分代码已由智能体编写，Metals v2 服务于需要手动介入的环节，简化了开发流程。","sourceName":"Databricks：Blog（RSS）","sourceUrl":"https://www.databricks.com/blog/open-sourcing-metals-v2-databricks-java-and-scala-language-server-multi-million-line-codebases","publishedAt":null,"comment":"","n":8,"isWeChat":false}],"empty":false,"review":"NVIDIA 的 Nemotron 3.5 Lightning 加速本地智能体任务，SGLang 迅速跟进，显示了行业的快速响应能力。Ling-3.0-tiny 的开源让轻量级模型有了更多实际应用的可能。Gemini 和 ChatGPT 的更新则继续强化了其在市场中的地位。"},{"key":"industry-paper","label":"行业 & 论文","items":[{"title":"研究人员发现可读取ChatGPT等模型加密推理过程的API漏洞","summary":"Alexander Panfilov团队的研究发现，OpenAI、Anthropic、Google等主要AI提供商的API存在严重漏洞，使得黑客可以读取ChatGPT等模型的加密推理过程。经过对约7000条公开会话的扫描，团队发现了62个API密钥、33个邮箱和33个密码。利用该漏洞，Anthropic的Haiku 4.5模型能够逐字转写OpenAI的Opus 4.8模型的原始推理过程，而解码10000条推理轨迹的API成本约为720美元。这一发现引发了对AI模型安全性的重大担忧，可能迫使相关公司加强安全措施。","sourceName":"The Decoder：AI News（RSS）","sourceUrl":"https://the-decoder.com/but-marinade-and-leaked-passwords-are-what-researchers-found-in-chatgpts-hidden-reasoning","publishedAt":"2026-08-11T17:38:49.000Z","comment":"","n":9,"isWeChat":false},{"title":"消息称 Anthropic 最快今年 9 月上市，向投资者淡化 AI 模型竞争等挑战","summary":"据消息人士透露，AI公司Anthropic正在与潜在投资者积极接触，计划于今年9月或10月初进行IPO。该公司估值高达9650亿美元，年化收入已超过470亿美元。尽管面临来自中国AI企业的竞争，Anthropic依然计划拓展AI在医疗和生物学领域的应用。不过，公司尚未公布具体的IPO定价方案。此次IPO可能成为史上规模最大的一次，标志着AI行业进入新的发展阶段。","sourceName":"IT之家（RSS）","sourceUrl":"https://www.ithome.com/0/988/239.htm","publishedAt":"2026-08-11T03:57:53.000Z","comment":"","n":10,"isWeChat":false},{"title":"Gemini月活破10亿，成谷歌增长最快产品","summary":"Geminiapp的月活跃用户已突破10亿大关，成为谷歌增长最快的产品之一。这一成就使Gemini成为了第14个达到10亿用户里程碑的产品。Geminiapp的快速增长得益于其创新的激发新想法和完成工作的功能，受到了用户的广泛欢迎。","sourceName":"X：Sundar Pichai (@sundarpichai)","sourceUrl":"https://x.com/sundarpichai/status/2087222656819241292","publishedAt":"2026-08-11T17:00:34.000Z","comment":"","n":11,"isWeChat":false},{"title":"消息称英伟达开发万亿参数开源 AI 模型 Nemotron 4，目标挑战全球顶级","summary":"英伟达正在研发新一代开源AI模型系列Nemotron 4，预计其规模最大的模型将超过1万亿个参数，旨在与全球最先进的开源模型竞争。尽管英伟达尚未确定发布日期，但员工预计该模型最早可能在今年秋末准备就绪。此举旨在通过开放模型生态扩大AI应用的范围，并推动市场对其GPU算力的需求。","sourceName":"IT之家（RSS）","sourceUrl":"https://www.ithome.com/0/988/524.htm","publishedAt":"2026-08-11T14:54:16.000Z","comment":"","n":12,"isWeChat":false},{"title":"NVIDIA 为何需要新供电架构以扩展 AI 算力性能","summary":"NVIDIA提出了一种新的供电架构，主张使用800VDC直流配电，以替代传统的交流多次转换，从而降低损耗并支撑AI算力的扩展。这一方案由NVIDIA与Google、Microsoft联合通过OCP制定，并已发布白皮书和 const WK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const pad = n => String(n).padStart(2,'0');

function fmtDateHuman(ds){
  const [y,m,d] = ds.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  return y + '年' + m + '月' + d + '日 ' + WK[dt.getUTCDay()];
}
function fmtBJ(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const bj = new Date(d.getTime() + 8*3600*1000);
  const M = bj.getUTCMonth()+1, D = bj.getUTCDate();
  const now = new Date(Date.now()+8*3600*1000);
  const tM = now.getUTCMonth()+1, tD = now.getUTCDate();
  let prefix;
  if(M===tM && D===tD) prefix='今天';
  else if(M===tM && D===tD-1) prefix='昨天';
  else prefix = M + '月' + D + '日';
  return prefix + ' ' + pad(bj.getUTCHours()) + ':' + pad(bj.getUTCMinutes());
}

  document.getElementById('leadBox').style.display = 'none';
}
if(DATA.bubbleComment){
  const bb = document.getElementById('leadBox');
  const d = document.createElement('div');
  d.className = 'bubble';
  d.innerHTML = '<span class="bl">🫧 AI 泡沫在慢慢爆掉吗？</span>' + DATA.bubbleComment;
  bb.appendChild(d);
}
document.getElementById('totalNum').textContent = DATA.total;

if(!DATA.isToday){
  const fb = document.getElementById('fallbackBox');
  fb.className = 'fallback';
  fb.textContent = '⚠ 当日日报尚未生成，已回退至最近一期（' + DATA.date + '）';
}

// STATS
const statsEl = document.getElementById('stats');
DATA.moduleStats.forEach(function(s,i){
  const c = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)'][i];
  const el = document.createElement('div');
  el.className = 'stat';
  el.innerHTML = '<div class="num" style="color:#fff">' + s.count + '</div><div class="lab">' + s.label + '</div>';
  statsEl.appendChild(el);
});

// NAV
const navEl = document.getElementById('nav');
DATA.modules.forEach(function(s,i){
  const a = document.createElement('a');
  a.href = '#sec-' + i;
  a.innerHTML = s.label + '<span class="c">' + s.items.length + '</span>';
  navEl.appendChild(a);
});
if(DATA.stocks && DATA.stocks.length){
  const a = document.createElement('a');
  a.href = '#sec-stocks';
  a.innerHTML = 'AI 概念股<span class="c">' + DATA.stocks.length + '</span>';
  navEl.appendChild(a);
}

// SECTIONS + CARDS
const main = document.getElementById('main');
DATA.modules.forEach(function(s,i){
  const sec = document.createElement('section');
  sec.className = 'section';
  sec.id = 'sec-' + i;
  const dot = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)'][i];
  sec.innerHTML =
    '<div class="sec-head">' +
      '<span class="sec-dot" style="background:' + dot + '"></span>' +
      '<h2>' + s.label + '</h2>' +
      '<span class="cnt">' + s.items.length + ' 条</span>' +
    '</div><div class="grid"></div>';
  const grid = sec.querySelector('.grid');
  if(s.empty){
    grid.innerHTML = '<div style="grid-column:1/-1;color:var(--sub);font-size:13.5px;' +
      'background:#fff;border:1px dashed var(--line);border-radius:14px;padding:18px 20px">' +
      '今日该模块暂无入选内容</div>';
  }
  if(s.review){
    const note = document.createElement('div');
    note.className = 'comment edit';
    note.style.gridColumn = '1/-1';
    note.style.marginTop = '0';
    note.innerHTML = '<span class="cl">模块辣评</span>' + s.review;
    grid.appendChild(note);
  }
  if(s.comment){
    const note = document.createElement('div');
    note.className = 'comment edit';
    note.style.gridColumn = '1/-1';
    note.style.marginTop = '0';
    note.innerHTML = '<span class="cl">编辑点评</span>' + s.comment;
    grid.appendChild(note);
  }
  s.items.forEach(function(it){
    const card = document.createElement('article');
    card.className = 'card';
    const time = fmtBJ(it.publishedAt);
    card.innerHTML =
      '<div class="c-top">' +
        '<span class="badge">' + it.n + '</span>' +
        '<span class="chip" title="' + it.sourceName.replace(/"/g,'&quot;') + '">' + it.sourceName + '</span>' +
        (it.isWeChat ? '<span class="chip wx" style="background:#07c160;color:#fff">💬 公众号</span>' : '') +
        (time ? '<span class="ctime">' + time + '</span>' : '') +
      '</div>' +
      '<h3>' + it.title + '</h3>' +
      '<p class="sum">' + it.summary + '</p>' +
      (it.comment ? '<div class="comment"><span class="cl">辣评</span>' + it.comment + '</div>' : '') +
      '<a class="go" href="' + it.sourceUrl + '" target="_blank" rel="noopener noreferrer">查看原文</a>';
    grid.appendChild(card);
  });
  main.appendChild(sec);
});

// STOCKS MODULE (AI-related companies, multi-market)
if(DATA.stocks && DATA.stocks.length){
  const sec = document.createElement('section');
  sec.className = 'section sec-stocks';
  sec.id = 'sec-stocks';
  sec.innerHTML =
    '<div class="sec-head">' +
      '<span class="sec-dot"></span>' +
      '<h2>AI 概念股</h2>' +
      '<span class="cnt">' + DATA.stocks.length + ' 只</span>' +
    '</div>' +
    '<div class="sec-cap">各市场收盘 / 盘中快照 · 来源 <a href="https://gu.qq.com/" target="_blank" rel="noopener noreferrer">' + (DATA.stockSource || '') + '</a>' +
      ' · 红涨绿跌 · 数据仅供参考，不构成投资建议</div>' +
    '<div class="stocks-grid"></div>';
  const grid = sec.querySelector('.stocks-grid');
  DATA.stocks.forEach(function(q){
    const up = q.change >= 0;
    const card = document.createElement('div');
    card.className = 'stock-card ' + (up ? 'up' : 'down');
    const arrow = up ? '▲' : '▼';
    const sign = up ? '+' : '';
    const rng = (q.dayLow != null && q.dayHigh != null)
      ? ('今日 ' + q.sym + q.dayLow.toFixed(2) + '–' + q.dayHigh.toFixed(2))
      : '';
    card.innerHTML =
      '<div class="sc-top"><span class="sc-tk">' + q.t + '</span>' +
        '<span class="sc-name">' + q.name + '</span>' +
        '<span class="sc-mkt">' + q.mktLabel + '</span></div>' +
      '<div class="sc-price"><span class="sc-cur">' + q.sym + '</span>' + q.price.toFixed(2) +
        ' <span class="sc-chg">' + arrow + ' ' + sign + q.change.toFixed(2) +
        ' (' + sign + q.changePct.toFixed(2) + '%)</span></div>' +
      (rng ? '<div class="sc-range">' + rng + '</div>' : '') +
      '<div class="sc-time">更新 ' + (q.bjTime || '') + '（北京时间）</div>';
    grid.appendChild(card);
  });
  main.appendChild(sec);
}

// FLASHES (bonus)
if(DATA.flashes && DATA.flashes.length){
  const sec = document.createElement('section');
  sec.className = 'section sec-flash';
  sec.id = 'sec-flashes';
  sec.innerHTML =
    '<div class="sec-head">' +
      '<span class="sec-dot"></span>' +
      '<h2>快讯</h2>' +
      '<span class="cnt">' + DATA.flashes.length + ' 条</span>' +
    '</div><div class="grid flash-grid"></div>';
  const grid = sec.querySelector('.grid');
  DATA.flashes.forEach(function(it){
    const card = document.createElement('article');
    card.className = 'card';
    const time = fmtBJ(it.publishedAt);
    card.innerHTML =
      '<div class="c-top">' +
        '<span class="badge">' + it.n + '</span>' +
        '<span class="chip" title="' + it.sourceName.replace(/"/g,'&quot;') + '">' + it.sourceName + '</span>' +
        (it.isWeChat ? '<span class="chip wx" style="background:#07c160;color:#fff">💬 公众号</span>' : '') +
        (time ? '<span class="ctime">' + time + '</span>' : '') +
      '</div>' +
      '<h3>' + it.title + '</h3>' +
      '<p class="sum">' + it.summary + '</p>' +
      (it.comment ? '<div class="comment"><span class="cl">辣评</span>' + it.comment + '</div>' : '') +
      '<a class="go" href="' + it.sourceUrl + '" target="_blank" rel="noopener noreferrer">查看原文</a>';
    grid.appendChild(card);
  });
  main.appendChild(sec);
}

// FOOTER
document.getElementById('footTotal').textContent = '本日报共 ' + DATA.total + ' 条 AI 动态';

// back to top
const topBtn = document.getElementById('top');
window.addEventListener('scroll', function(){
  topBtn.classList.toggle('show', window.scrollY > 500);
});
topBtn.addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); });

</script>
